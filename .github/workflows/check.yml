# Vérifie à chaque push que l'appli se construit (Windows et Android).
# Sur les branches de travail, publie aussi une pré-version « preview »
# (non signée, sans connexion Google côté Windows) pour les tests internes.
name: Check

on:
  push:
    branches: ["main", "claude/**"]
  pull_request:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:win
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: release/Mon-Journal-Setup.exe

  android:
    runs-on: ubuntu-latest
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npm run build:android
      - name: Compiler l'APK (non signé)
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease
          cp app/build/outputs/apk/release/app-release-unsigned.apk "$GITHUB_WORKSPACE/Mon-Journal-unsigned.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: Mon-Journal-unsigned.apk

  preview:
    if: github.event_name == 'push'
    needs: [windows, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: preview
          name: Build de test (interne)
          prerelease: true
          make_latest: false
          target_commitish: ${{ github.sha }}
          body: Build interne de test, non signé. Les vraies versions sont les Releases « Mon Journal x.y.z ».
          files: |
            out/Mon-Journal-Setup.exe
            out/Mon-Journal-unsigned.apk
