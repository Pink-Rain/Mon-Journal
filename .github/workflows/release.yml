# Construit l'installateur Windows et l'APK Android, puis les publie dans
# une Release GitHub. Se déclenche quand on pousse un tag « v0.2.0 », ou à
# la main depuis l'onglet Actions (le tag est alors créé d'après package.json).
#
# Secrets à créer dans Settings → Secrets and variables → Actions :
#   MJ_GOOGLE_DESKTOP_CLIENT_SECRET  code secret du client Google « bureau »
#   ANDROID_KEYSTORE_PASSWORD        mot de passe de signing/monjournal-release.p12.enc
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      tag: ${{ steps.v.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF_TYPE" == "tag" && "$GITHUB_REF_NAME" != "v$VERSION" ]]; then
            echo "::error::Le tag $GITHUB_REF_NAME ne correspond pas à package.json ($VERSION)"
            exit 1
          fi

  windows:
    needs: version
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Construire l'installateur
        env:
          MJ_GOOGLE_DESKTOP_CLIENT_SECRET: ${{ secrets.MJ_GOOGLE_DESKTOP_CLIENT_SECRET }}
        run: npm run build:win
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          if-no-files-found: error
          path: |
            release/Mon-Journal-Setup.exe
            release/Mon-Journal-Setup.exe.blockmap
            release/latest.yml

  android:
    needs: version
    runs-on: ubuntu-latest
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
      - run: npm ci
      - name: Préparer le projet Android
        run: npm run build:android
      - name: Déchiffrer la clé de signature
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_PASSWORD" ]; then
            echo "::error::Secret ANDROID_KEYSTORE_PASSWORD manquant"
            exit 1
          fi
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 600000 \
            -in signing/monjournal-release.p12.enc \
            -out "$RUNNER_TEMP/monjournal-release.p12" \
            -pass env:ANDROID_KEYSTORE_PASSWORD
      - name: Construire l'APK
        working-directory: android
        env:
          MJ_KEYSTORE_FILE: ${{ runner.temp }}/monjournal-release.p12
          MJ_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease
          cp app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/Mon-Journal.apk"
      - name: Vérifier la signature
        run: |
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --print-certs Mon-Journal.apk | tee signature.txt
          grep -qi "e9:8b:d0:ac:52:cb:b4:f1:4c:99:20:bf:df:e7:66:68:d9:d6:fb:08\|e98bd0ac52cbb4f14c9920bfdfe76668d9d6fb08" signature.txt
      - uses: actions/upload-artifact@v4
        with:
          name: android
          if-no-files-found: error
          path: Mon-Journal.apk

  publish:
    needs: [version, windows, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - name: Publier la Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          name: Mon Journal ${{ needs.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          body: |
            **Windows** : [Mon-Journal-Setup.exe](https://github.com/Pink-Rain/Mon-Journal/releases/latest/download/Mon-Journal-Setup.exe)
            **Android** : [Mon-Journal.apk](https://github.com/Pink-Rain/Mon-Journal/releases/latest/download/Mon-Journal.apk)

            L'appli se met à jour toute seule une fois installée.
          files: |
            out/Mon-Journal-Setup.exe
            out/Mon-Journal-Setup.exe.blockmap
            out/latest.yml
            out/Mon-Journal.apk
